apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-jmeter-vts-vs
  namespace: {{ .Values.namespace }}
spec:
  hostnames:
    - {{ .Values.host.vts }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ingressgateway
      namespace: istio-ingress
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Release.Name }}-jmeter-vts
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
