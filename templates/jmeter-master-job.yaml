apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-jmeter-master
  labels:
    name: {{ .Release.Name }}-jmeter-master

spec:
  schedule: "5 5 5 5 5" # Adjust the schedule as needed
  suspend: true

  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}-jmeter-master

        spec:
          hostAliases:
            - hostnames:
                - islamic-channels.stgd.dhofarislamic.com
              ip: 10.141.218.208

            - hostnames:
                - core.stgd.dhofarislamic.com
              ip: 10.141.218.208

            - hostnames:
                - apihub.stgd.dhofarislamic.com
              ip: 10.141.218.208

          serviceAccountName: {{ .Release.Name }}-jmeter-master-sa
          restartPolicy: Never

          containers:
            - name: jmeter-master
              image: "{{ .Values.Master.image | default "yethitech/performance-testing" }}:{{ .Values.Master.imageTag | default "kube-6-3-26" }}"
              imagePullPolicy: Always

              env:
                - name: HEAP
                  value: {{ .Values.Master.heap | default "-Xms1g -Xmx8g" }}

                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.name

              securityContext:
                privileged: true

              ports:
                - containerPort: 1099
                - containerPort: 60000

              volumeMounts:
                {{- if .Values.Master.extraVolumeMounts }}
                {{- toYaml .Values.Master.extraVolumeMounts | nindent 16 }}
                {{- end }}

              resources:
                requests:
                  memory: {{ .Values.Master.resources.requests.memory | default "5Gi" }}
                  cpu: {{ .Values.Master.resources.requests.cpu | default "1" }}

                limits:
                  memory: {{ .Values.Master.resources.limits.memory | default "5Gi" }}
                  cpu: {{ .Values.Master.resources.limits.cpu | default "3" }}

              command:
                - /bin/sh
                - -c

              args:
                - |
                  echo "waiting for s3 fs"
                  sleep 30

                  echo "starting master job"
                  set -x

                  MAX_RETRIES=2
                  RETRY_DELAY=5

                  i=0
                  while [ $i -le $MAX_RETRIES ]; do
                    SLAVE_IPS=$(kubectl get pods -l app={{ .Release.Name }}-jmeter-worker -o jsonpath='{.items[*].status.podIP}' | tr ' ' ',')

                    if [ -n "$SLAVE_IPS" ]; then
                      echo "Slave IPs found: $SLAVE_IPS"
                      break
                    fi

                    echo "No slave IPs found. Retrying in $RETRY_DELAY seconds... (Attempt $((i+1)) of $((MAX_RETRIES+1)))"
                    sleep $RETRY_DELAY
                    i=$((i+1))
                  done

                  if [ -z "$SLAVE_IPS" ]; then
                    echo "No slave IPs found! Exiting..."
                    exit 1
                  fi

                  jmeter -n \
                    -t {{ .Values.Workers.csvFilePath }}/Tenjin.jmx \
                    -R $SLAVE_IPS \
                    -r \
                    -Dserver.rmi.ssl.disable=true \
                    -Jserver.rmi.localport=60000 \
                    -Jclient.rmi.localport=1099 \
                    -e -o {{ .Values.Workers.csvFilePath }}/reports.html \
                    -l {{ .Values.Workers.csvFilePath }}/results.jtl \
                    -j {{ .Values.Workers.csvFilePath }}/results.log

                  echo "JMeter test execution completed."

            {{- if .Values.extraContainers }}
            {{- toYaml .Values.extraContainers | nindent 12 }}
            {{- end }}

          volumes:
            {{- if .Values.extraVolumes }}
            {{- toYaml .Values.extraVolumes | nindent 12 }}
            {{- end }}