apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-jmeter-master
  labels:
    name: {{ .Release.Name }}-jmeter-master
spec:
  schedule: "5 5 5 5 5" # Adjust the schedule as needed
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}-jmeter-master
        spec:
          serviceAccountName: {{ .Release.Name }}-jmeter-master-sa
          restartPolicy: Never
          containers:
            - name: jmeter-master
              image: "{{ .Values.Master.image | default "yethitech/performance-testing" }}:{{ .Values.Master.imageTag | default "kube-3-2-25" }}"
              imagePullPolicy: Always
              env:
                - name: HEAP
                  value: {{ .Values.Master.heap | default "-Xms1g -Xmx8g" }}
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.name
              securityContext:
                privileged: true
              ports:
                - containerPort: 1099
                - containerPort: 60000
              volumeMounts:
              {{- if .Values.Master.extraVolumeMounts }}
              {{- toYaml .Values.Master.extraVolumeMounts | nindent 16 }}
              {{- end }}
              resources:
                requests:
                  memory: {{ .Values.Master.resources.requests.memory | default "5Gi" }}
                  cpu: {{ .Values.Master.resources.requests.cpu | default "1" }}
                limits:
                  memory: {{ .Values.Master.resources.limits.memory | default "5Gi" }}
                  cpu: {{ .Values.Master.resources.limits.cpu | default "3" }}
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -x  # Enable shell debugging
                  # Retry mechanism to fetch IPs of all JMeter slave pods
                  MAX_RETRIES=2  # Number of retries
                  RETRY_DELAY=5  # Delay in seconds between retries
                  i=0
                  while [ $i -le $MAX_RETRIES ]; do
                    SLAVE_IPS=$(kubectl get pods -l app={{ .Release.Name }}-jmeter-worker -o jsonpath='{.items[*].status.podIP}' | tr ' ' ',')
                    SLAVE_PODS=$(kubectl get pods -l app={{ .Release.Name }}-jmeter-worker -o jsonpath='{.items[*].metadata.name}')
                    if [ -n "$SLAVE_IPS" ]; then
                      echo "Slave IPs found: $SLAVE_IPS"
                      echo "Slave PODS found: $SLAVE_PODS"
                      break
                    fi
                    echo "No slave IPs found. Retrying in $RETRY_DELAY seconds... (Attempt $((i+1)) of $((MAX_RETRIES+1)))"
                    sleep $RETRY_DELAY
                  done

                  # Exit if no IPs are found
                  if [ -z "$SLAVE_IPS" ]; then
                    echo "No slave IPs found! Exiting..."
                    exit 1
                  fi

                  # Convert pods to positional parameters 
                  set -- $SLAVE_PODS
                  POD_LIST="$@" 
                  echo "POD_LIST: $POD_LIST"

                  # Convert IPs from comma-separated to space-separated
                  IP_LIST=$(echo "$SLAVE_IPS" | tr ',' ' ') 
                  echo "IP_LIST:$IP_LIST"

                  # Set IPs as new positional parameters 
                  set -- $IP_LIST
                  IP_ARRAY="$@"

                  # Run JMeter on each pod with its corresponding IP 
                  echo "Iterating with index:" 
                  index=1 
                  for pod in $POD_LIST; do
                    ip=$(echo "$IP_ARRAY" | cut -d' ' -f$index)
                    base_path="/csv/deh/pt/$pod"
                    echo "Starting JMeter on pod $pod with IP $ip and JMX path $base_path"
                    jmeter -n -t $base_path/Tenjin.jmx \
                      -R $ip \
                      -r \
                      -Dserver.rmi.ssl.disable=true \
                      -Jserver.rmi.localport=60000 \
                      -Jclient.rmi.localport=1099 \
                      -e -o $base_path/reports.html \
                      -l $base_path/results.jtl \
                      -j $base_path/results.log
                    echo "Jmeter Started...."  
                    index=$((index + 1))
                  done 
                  echo "All JMeter tests completed."
          volumes:
            {{- if .Values.Master.extraVolumes }}
            {{- toYaml .Values.Master.extraVolumes | nindent 12 }}
            {{- end }}